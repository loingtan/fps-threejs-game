<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title><%= htmlWebpackPlugin.options.title %></title>
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Barcode+39+Text&family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        font-family: "Roboto", sans-serif;
        color: white;
      }
      #crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 2%;
        transform: translate(-50%, -50%);
      }
      #ammo_container {
        position: absolute;
        right: 5%;
        bottom: 5%;
        font-size: 1.5em;
        color: #00ff00;
        font-weight: bold;
        text-shadow: 2px 2px 4px #000000;
      }
      #progress {
        position: absolute;
        bottom: 9%;
        left: 0;
        width: 0;
        height: 2%;
        background-color: white;
      }
      #health_container {
        position: absolute;
        bottom: 8%;
        left: 5%;
        width: 18%;
        height: 2%;
        border: 1px solid #ffffff;
      }
      #health_progress {
        position: absolute;
        background-color: #ff0000;
        width: 100%;
        height: 100%;
      }
      #game_hud {
        visibility: hidden;
      }
      #menu {
        position: absolute;
        width: 100%;
        height: 100%;
        background: url("<%=require('./assets/background/aliendownload.jpg')%>")
          no-repeat center center fixed;
        background-size: cover;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        visibility: hidden;
      }
      h1 {
        font-family: "Libre Barcode 39 Text", cursive;
        font-size: 4em;
      }
      button {
        background-color: rgba(0, 0, 0, 0);
        color: rgb(221, 221, 221);
        font-size: 1.5em;
        border: none;
        cursor: pointer;
        margin-top: 10%;
        font-weight: 700;
      }
      #menu_buttons {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #game_logo {
        width: 150px;
        height: 150px;
        margin-bottom: 20px;
      }
      #character_selection {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
      }
      .character_option {
        background-color: rgba(255, 255, 255, 0.1);
        border: 2px solid rgba(255, 255, 255, 0.3);
        padding: 15px 30px;
        cursor: pointer;
        transition: all 0.3s ease;
        border-radius: 5px;
        font-size: 1.2em;
        color: #dddddd;
      }
      .character_option:hover {
        background-color: rgba(255, 255, 255, 0.2);
        border-color: rgba(255, 255, 255, 0.6);
      }
      .character_option.selected {
        background-color: rgba(0, 255, 0, 0.3);
        border-color: #00ff00;
        color: #00ff00;
      }
      #camera_mode_indicator {
        position: absolute;
        top: 10%;
        left: 5%;
        font-size: 1.2em;
        color: #00ff00;
        text-shadow: 2px 2px 4px #000000;
        background-color: rgba(0, 0, 0, 0.5);
        padding: 10px 15px;
        border-radius: 5px;
      }
      #debug {
        position: absolute;
        right: 5%;
        top: 5%;
      }
      #score_container {
        position: absolute;
        left: 5%;
        top: 5%;
        font-size: 2em;
        color: #ffff00;
        text-shadow: 2px 2px 4px #000000;
      }
      #monster_health_bars {
        position: absolute;
        top: 5%;
        left: 50%;
        transform: translateX(-50%);
        width: 30%;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .monster-health-bar {
        width: 100%;
        height: 10px;
        background-color: rgba(0, 0, 0, 0.5);
        margin-bottom: 5px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.5s;
      }
      .monster-health-bar .health-fill {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        background-color: red;
        transition: width 0.2s;
      }
      .monster-health-bar .health-text {
        position: relative;
        color: white;
        font-size: 10px;
        text-shadow: 1px 1px 1px #000;
        z-index: 2;
      }
      #game_over {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.8);
        color: #ff3333;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        font-family: "Roboto", sans-serif;
        animation: pulse 2s infinite;
      }
      #game_over h2 {
        font-size: 4em;
        margin-bottom: 20px;
        text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
      }
      #game_over p {
        font-size: 1.5em;
        text-shadow: 0 0 5px #ff0000;
      }
      #success_screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.8);
        color: #33ff33;
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        font-family: "Roboto", sans-serif;
        animation: success_pulse 2s infinite;
      }
      #success_screen h2 {
        font-size: 4em;
        margin-bottom: 20px;
        text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00;
      }
      #success_screen p {
        font-size: 1.5em;
        text-shadow: 0 0 5px #00ff00;
      }
      #success_screen button {
        margin-top: 40px;
        background-color: rgba(0, 255, 0, 0.2);
        color: #33ff33;
        border: 2px solid #33ff33;
        padding: 10px 20px;
        border-radius: 5px;
        font-size: 1.2em;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      #success_screen button:hover {
        background-color: rgba(0, 255, 0, 0.4);
      }
      @keyframes success_pulse {
        0% {
          text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00;
        }
        50% {
          text-shadow: 0 0 15px #33ff33, 0 0 30px #33ff33;
        }
        100% {
          text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00;
        }
      }
      @keyframes pulse {
        0% {
          text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
        }
        50% {
          text-shadow: 0 0 15px #ff3333, 0 0 30px #ff3333;
        }
        100% {
          text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
        }
      }
    </style>
  </head>

  <body>
    <div id="debug"></div>
    <div id="menu">
      <img id="game_logo" src="<%=require('./assets/logo/logo.svg')%>" alt="Game Logo" />
      <h1>Alien Shooter</h1>
      <audio
        id="menu_music"
        src="<%=require('./assets/sounds/alienshooter2-theme-games-background-music.wav')%>"
        loop
      ></audio>
      <div id="character_selection">
        <div class="character_option selected" data-character="male">Male Character</div>
        <div class="character_option" data-character="female">Female Character</div>
      </div>
      <div id="menu_buttons">
        <button id="start_game">NEW GAME</button>
        <!-- <button id="continue_game">CONTINUE GAME</button> -->
      </div>
    </div>
    <div id="game_hud">
      <img id="crosshair" src="<%=require('./ui/crosshair.png')%>" />
      <div id="ammo_container">
        <span id="current_ammo">0</span>
        <span>|</span>
        <span id="max_ammo">0</span>
      </div>
      <div id="health_container">
        <div id="health_progress"></div>
      </div>
      <div id="camera_mode_indicator">Camera: First Person (Press V to toggle)</div>
    </div>
    <div id="progress"></div>
    <div id="success_screen">
      <h2>Game completed</h2>
      <p>All monsters eliminated!</p>
      <button id="return_to_menu">Return to Menu</button>
    </div>
    <my-app></my-app>
  </body>
</html>
